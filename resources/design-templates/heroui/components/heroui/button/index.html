<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HeroUI · Button 视觉参考</title>
  <link rel="stylesheet" href="../theme/palette.css">
  <link rel="stylesheet" href="../theme/theme.css">
  <link rel="stylesheet" href="../theme/theme-dark.css">
  <link rel="stylesheet" href="style.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: var(--asset-font); color: var(--asset-text); background: var(--asset-background); }
    .sample { padding: 24px; border-radius: 16px; background: var(--asset-surface); }
    h1 { margin: 0 0 8px; font-size: 18px; }
    p { color: var(--asset-muted); font-size: 12px; line-height: 1.6; }
    .buttons { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
  </style>
</head>
<body>
  <section class="sample">
    <h1>HeroUI · 按钮</h1>
    <p>Plant 编写的 HTML 视觉参考。真实 React 组件请按 design-guide.md 接入。</p>
    <div class="buttons">
      <button class="asset-button asset-button--primary" type="button">主要操作</button>
      <button class="asset-button" type="button">次要操作</button>
      <button class="asset-button" type="button" disabled>禁用状态</button>
    </div>
  </section>
</body>
</html>
