<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header class="popup-header">
      <div class="brand">
        <img class="brand__mark" src="../icons/icon48.png" alt="" aria-hidden="true">
        <div class="brand__copy">
          <div class="brand__name">WorkSpace 剪页</div>
          <div class="brand__desc">保存网页选区到剪页库</div>
        </div>
      </div>

      <button id="status-bar" class="status-bar status-bar--checking" type="button" title="点击重试连接">
        <span class="status-bar__dot"></span>
        <span class="status-bar__text">检测中</span>
      </button>
    </header>

    <main class="popup-body">
      <!-- 初始状态 -->
      <section id="state-initial" class="state-panel">
        <div class="state-heading">
          <p class="eyebrow">网页剪藏</p>
          <h1>选取页面内容，保存到 WorkSpace</h1>
          <p class="lead">适合沉淀灵感、竞品片段、需求材料和可复用页面结构。</p>
        </div>

        <button id="btn-start" class="button button--primary button--full" disabled>开始选取</button>

        <div class="flow" aria-label="剪页流程">
          <div class="flow__item">
            <span class="flow__step">1</span>
            <span>框选网页元素</span>
          </div>
          <div class="flow__item">
            <span class="flow__step">2</span>
            <span>确认标题与标签</span>
          </div>
          <div class="flow__item">
            <span class="flow__step">3</span>
            <span>发送到聊天处理</span>
          </div>
        </div>

        <p id="hint-target" class="footnote">保存到系统剪页库，跨项目可用。</p>
      </section>

      <!-- 选区中 -->
      <section id="state-selecting" class="state-panel" hidden>
        <div class="selecting-card">
          <span class="selecting-card__pulse" aria-hidden="true"></span>
          <div>
            <h1>正在选取网页内容</h1>
            <p class="lead">移动鼠标定位元素，点击页面即可确认。</p>
          </div>
        </div>
        <div class="shortcut-row" aria-label="快捷键">
          <span><kbd>↑</kbd><kbd>↓</kbd> 调整层级</span>
          <span><kbd>Esc</kbd> 取消</span>
        </div>
        <button id="btn-cancel" class="button button--secondary button--full">取消选取</button>
      </section>

      <!-- 选完展示结果 -->
      <section id="state-result" class="state-panel" hidden>
        <div class="result-head">
          <div>
            <p class="eyebrow">待保存</p>
            <h1 id="result-title"></h1>
          </div>
        </div>

        <div class="source-card">
          <div class="source-card__label">来源</div>
          <div class="source-card__main" id="result-site">未知来源</div>
          <div class="source-card__url" id="result-url"></div>
        </div>

        <div class="summary-grid">
          <div class="summary-item">
            <span>正文</span>
            <strong id="result-text-count">0 字</strong>
          </div>
          <div class="summary-item">
            <span>媒体</span>
            <strong id="result-media-count">0 个</strong>
          </div>
        </div>

        <div id="result-media-badges" class="media-badges"></div>
        <div id="result-thumbs" class="thumbs"></div>

        <label class="field">
          <span class="field__label">文件名</span>
          <input id="result-file-name" type="text" placeholder="输入保存文件名" />
        </label>

        <label class="field">
          <span class="field__label">标签</span>
          <input id="result-tags" type="text" placeholder="逗号分隔，如 ai, design, 灵感" />
        </label>

        <div class="preview-card">
          <div class="preview-card__label">内容预览</div>
          <div id="result-preview"></div>
        </div>

        <div id="result-actions" class="action-row">
          <button id="btn-cancel-result" class="button button--secondary">取消</button>
          <button id="btn-save" class="button button--primary">保存到 WorkSpace</button>
        </div>
      </section>

      <!-- 完成 -->
      <section id="state-done" class="state-panel done-panel" hidden>
        <div class="done-icon" aria-hidden="true">✓</div>
        <h1>已保存到剪页库</h1>
        <p class="lead">已唤起 WorkSpace 并放入聊天，回到 App 发送即可继续处理。</p>
        <p id="done-id" class="save-id"></p>
        <button id="btn-done-more" class="button button--primary button--full">再剪一条</button>
      </section>
    </main>
  </div>
  <script src="popup.js"></script>
</body>
</html>
