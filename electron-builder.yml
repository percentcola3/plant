appId: com.plant.app
productName: Plant

# Avoid recursive expansion of cyclic hoisted dependencies in builder 26.15.3.
beforePack: scripts/builder-cycle-guard.cjs

directories:
  output: release/${version}
  buildResources: build

# 哪些文件进入打包产物。electron-builder 自动只带 dependencies（不带 devDependencies）。
files:
  - out/**/*
  - package.json
  - "!node_modules/**/{CHANGELOG.md,README.md,readme.md,PATENTS,LICENSE}"
  - "!**/{.eslintrc,.prettierrc,.editorconfig,.gitignore,.gitattributes}"

# 把 inspector / skill-templates 这些运行时资源复制到
# process.resourcesPath/<...>，preview-server 的 resolveAppResource() 在
# packaged 态从这里读。
# 注：claude-code 二进制不内置——用户照内网指南自己装，App 仅做环境检查。
extraResources:
  - from: resources
    to: .
    filter:
      - "**/*"
      - "!chrome-extension/**/*"
  # Dock 在灵动岛窗口触发 macOS 进程类型切换后会重新显示；运行时用这张
  # PNG 显式恢复图标，避免系统选中错误尺寸的缓存 representation。
  - from: build/icon.png
    to: icon.png
  - from: src/renderer/src/assets/fonts/OFL.txt
    to: licenses/lxgw-wenkai/OFL.txt

# 应用代码保留 asar；生产依赖完整 unpack。
# zg 通过 ELECTRON_RUN_AS_NODE 从真实路径运行，普通 Node 模块解析不会去
# 相邻 app.asar 查找依赖。只 unpack native/zg 会漏掉 MCP、zod 等传递依赖，
# 且开发目录中的 node_modules 会掩盖这个问题。
asar: true
asarUnpack:
  - "node_modules/**/*"

mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
  # v1 不签名（spec §15.1）。首次打开右键 → 打开绕过 Gatekeeper。
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  artifactName: "${productName}-${version}-${arch}.${ext}"

dmg:
  artifactName: "${productName}-${version}-${arch}.${ext}"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# GitHub 发布由 gh release 上传安装包
publish: null
